<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8ff5b">
  <meta name="description" content="书桌 · 运营岗位资质题库">
  <title>书桌</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23191b1e'/%3E%3Cpath d='M15 17h27a7 7 0 0 1 7 7v27H22a7 7 0 0 1-7-7V17Z' fill='%23e8ff5b'/%3E%3Cpath d='M22 17v34M28 25h14M28 33h11' stroke='%23191b1e' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-view="home" aria-label="返回首页"><span class="brand-mark">书</span><span><strong>书桌</strong><small>OPERATIONS DESK</small></span></button>
      <nav id="nav">
        <button class="active" data-view="home"><span>⌂</span>今日书桌</button>
        <button data-view="practice"><span>◫</span>开始刷题</button>
        <button data-view="flash"><span>▱</span>闪卡记忆</button>
        <button data-view="mistakes"><span>◒</span>错题集</button>
        <button data-view="stats"><span>⌁</span>学习进度</button>
        <button data-view="easter"><span>✦</span>彩蛋模式</button>
      </nav>
      <div class="sidebar-foot">
        <button id="themeQuick"><span class="theme-dot"></span><span><b>更换皮肤</b><small id="themeName">纸墨青柠</small></span></button>
        <button data-view="settings"><span>⚙</span><span><b>偏好设置</b><small>字体 · 声音 · 背景</small></span></button>
      </div>
    </aside>
    <main id="main"></main>
    <nav class="mobile-nav">
      <button class="active" data-view="home"><span>⌂</span>首页</button>
      <button data-view="practice"><span>◫</span>刷题</button>
      <button data-view="mistakes"><span>◒</span>错题</button>
      <button data-view="stats"><span>⌁</span>进度</button>
      <button data-view="settings"><span>⚙</span>设置</button>
    </nav>
  </div>
  <dialog id="sheet"><div id="sheetContent"></div></dialog>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
